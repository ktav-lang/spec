name: corpus-validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate conformance corpus structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rebuild spec.md/.ru.md/.zh.md from content units and verify byte-identity
        run: node scripts/build_spec.mjs --check

      - name: Run content builder adversarial tests
        run: node --test scripts/test_build_spec.mjs

      - name: Check translation structure in every source tree
        run: node scripts/check_sources.mjs

      - name: Run source checker unit tests
        run: node --test scripts/test_check_sources.mjs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Validate corpus structure
        run: |
          python scripts/validate_corpus.py versions/0.7/tests --require-unrepresentable --require-boundary --require-manifest --boundary-manifest-lock scripts/locks/boundary-fixtures.0.7.lock.json --corpus-inventory-lock scripts/locks/corpus-inventory.0.7.lock.json
          python scripts/validate_corpus.py versions/0.8/tests --require-unrepresentable --require-boundary --require-manifest --boundary-manifest-lock scripts/locks/boundary-fixtures.0.8.lock.json --corpus-inventory-lock scripts/locks/corpus-inventory.0.8.lock.json

      - name: Run validator unit tests
        run: python scripts/test_validate_corpus.py

      - name: Check EN/RU/ZH translation parity
        run: python scripts/check_translation_parity.py versions/0.8/spec.md versions/0.8/spec.ru.md versions/0.8/spec.zh.md

      - name: Run translation parity checker unit tests
        run: python scripts/test_check_translation_parity.py
